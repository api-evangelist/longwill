name: longwill
description: >-
  Longwill (Zhejiang Kangjiu Health Technology Group, 浙江康久康养科技集团有限公司) is a Chinese
  digital elderly-care and community-health group building what it calls a "China digital elder-care
  ecosystem" (数字康养). Operating from Xiaoshan District, Hangzhou, it runs 40-plus medical and
  senior-care institutions across Zhejiang (Hangzhou, Jiaxing, Ningbo, Quzhou, Jinhua, Zhoushan),
  Chengdu (Sichuan) and Shizuishan (Ningxia), organized around a "five-in-one" care model spanning a
  digital care cloud, CCRC senior-living complexes, institutional medical-and-elder care, community
  care and home care. It is a portfolio company of Qiming Venture Partners. As of this enrichment
  pass Longwill publishes a corporate marketing website (www.longwill.com.cn) but exposes no public
  developer portal, API, SDK, or documentation surface.
